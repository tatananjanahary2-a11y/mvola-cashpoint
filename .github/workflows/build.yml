name: FAST CASHPOINT Production APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
             release/FAST_CASHPOINT_PRODUCTION.apk

      - name: Verify APK
        run: |
          ls -lh release/FAST_CASHPOINT_PRODUCTION.apk
          sha256sum release/FAST_CASHPOINT_PRODUCTION.apk

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: FAST_CASHPOINT_PRODUCTION
          path: release/FAST_CASHPOINT_PRODUCTION.apk
          if-no-files-found: error
