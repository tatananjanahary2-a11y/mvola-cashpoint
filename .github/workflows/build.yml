name: FAST CASHPOINT Production APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build Release APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Rename APK
        run: |
          set -e
          mkdir -p release

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found in app/build/outputs/apk/release/"
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" release/FAST_CASHPOINT_PRODUCTION.apk

      - name: Verify APK
        run: |
          set -e

          test -f release/FAST_CASHPOINT_PRODUCTION.apk

          ls -lh release/FAST_CASHPOINT_PRODUCTION.apk

          sha256sum release/FAST_CASHPOINT_PRODUCTION.apk

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: FAST_CASHPOINT_PRODUCTION
          path: release/FAST_CASHPOINT_PRODUCTION.apk
          if-no-files-found: error
